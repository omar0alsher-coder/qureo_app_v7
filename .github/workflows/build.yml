name: Build APK Android 16 Compatible
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Setup Android SDK and NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev libltdl-dev libsqlite3-dev libbz2-dev liblzma-dev libreadline-dev
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          mv cmdline-tools latest
          cd $HOME
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" > /dev/null
          mkdir -p $HOME/android-sdk/tools/bin
          ln -s $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager $HOME/android-sdk/tools/bin/sdkmanager
          ln -s $HOME/android-sdk/cmdline-tools/latest/bin/avdmanager $HOME/android-sdk/tools/bin/avdmanager

      - name: Build APK
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_NDK_HOME: /home/runner/android-sdk/ndk/25.2.9519653
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv
          export PATH="$HOME/.local/bin:$PATH"
          
          cat > buildozer.spec << 'SPECEOF'
          [app]
          title = Qureo Premium
          package.name = qureopremium
          package.domain = org.qureo
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,html,js,css
          version = 1.0
          requirements = python3,flask,requests
          orientation = portrait
          fullscreen = 1
          android.permissions = INTERNET
          android.api = 34
          android.minapi = 21
          android.archs = arm64-v8a
          p4a.bootstrap = webview
          p4a.port = 8080
          p4a.branch = master
          android.sdk_path = /home/runner/android-sdk
          android.ndk_path = /home/runner/android-sdk/ndk/25.2.9519653
          android.accept_sdk_license = True
          [buildozer]
          log_level = 2
          warn_on_root = 0
          SPECEOF
          
          # 🔥 أقوى خطوة: ننزل الأداة الأول ونعدل كل ملفات المانيفست بالقوة قبل البناء
          git clone -b master --single-branch https://github.com/kivy/python-for-android.git .buildozer/android/platform/python-for-android || true
          find .buildozer -name "AndroidManifest.tmpl.xml" -exec sed -i 's/<application /<application android:usesCleartextTraffic="true" /g' {} \;
          
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
